<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tab-oil options</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0f111a;
      color: #c0caf5;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
    }
    h1 { color: #7aa2f7; font-size: 16px; margin: 0 0 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #1a1c2e; }
    th { color: #565f89; font-size: 11px; text-transform: uppercase; }
    input, select { background: #1a1c2e; color: #c0caf5; border: 1px solid #2c3052; padding: 6px 8px; font-family: inherit; font-size: 13px; width: 100%; }
    button { background: #2f3a5e; color: #c0caf5; border: none; padding: 6px 14px; cursor: pointer; font-family: inherit; font-size: 13px; }
    button:hover { background: #3b4261; }
    .actions { margin-top: 16px; display: flex; gap: 8px; }
    #status { color: #9ece6a; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>tab-oil — Global Shortcuts</h1>
  <table>
    <thead><tr><th>Keyboard Shortcut</th><th>Action</th><th>URL</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="actions">
    <button id="addBtn">+ Add</button>
    <button id="saveBtn">Save</button>
  </div>
  <div id="status"></div>
  <script type="module" src="src/options/main.ts"></script>
</body>
</html>
