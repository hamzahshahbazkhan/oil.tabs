<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab-oil</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --bg: #080a12;
        --panel: #111522;
        --panel-raised: #171c2b;
        --border: #252c40;
        --muted: #77809a;
        --text: #d8def8;
        --accent: #9bb7f5;
        --pink: #e7afd5;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      }
      #appShell {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        min-height: 280px;
        overflow: hidden;
        background: var(--panel);
      }
      #topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        user-select: none;
      }
      #brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .02em;
      }
      #mode {
        margin-left: auto;
        padding: 4px 8px;
        color: var(--accent);
        background: transparent;
        border: 1px solid var(--border);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .12em;
      }
      #topHint { color: var(--muted); font-size: 11px; }
      #editor {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      #editor .cm-editor { height: 100%; }
      #staleBanner {
        flex: 0 0 auto;
        display: none;
        min-height: 30px;
        padding: 7px 16px;
        color: #f5d08a;
        background: #27251e;
        border-bottom: 1px solid #66562f;
        font-size: 11px;
      }
      #footer {
        display: flex;
        align-items: center;
        min-height: 34px;
        border-top: 1px solid var(--border);
      }
      #statusbar {
        flex: 1;
        padding: 0 16px;
        font-size: 12px;
        color: var(--muted);
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #footerHints { padding: 0 16px; color: #4e5778; font-size: 10px; }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 54px;
        z-index: 200;
        max-width: min(620px, calc(100vw - 32px));
        padding: 10px 14px;
        color: #f7d6e9;
        background: #241e2b;
        border: 1px solid #684e67;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition: opacity .18s ease, transform .18s ease;
      }
      #toast.visible { opacity: 1; transform: translate(-50%, 0); }
      #closeBtn {
        position: fixed;
        top: 12px;
        right: 14px;
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        z-index: 100;
      }
      #closeBtn:hover {
        background: #26324f;
        color: var(--text);
      }
      @media (max-width: 700px) {
        #appShell { width: 100vw; height: 100vh; }
        #topHint, #footerHints { display: none; }
      }
      @media (max-height: 520px) {
        #appShell { height: 100vh; }
        #topbar { min-height: 40px; }
      }
    </style>
  </head>
  <body>
    <main id="appShell">
      <header id="topbar">
        <div id="brand">tab-oil</div>
        <span id="topHint">tab workspace</span>
        <span id="mode">NORMAL</span>
      </header>
      <div id="staleBanner">⚠ browser state changed — press <strong>gr</strong> to refresh</div>
      <div id="editor"></div>
      <footer id="footer"><div id="statusbar">Loading workspace…</div><div id="footerHints">Enter focus · :w save · gr refresh · ? help</div></footer>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <button id="closeBtn" aria-label="Close buffer">&times;</button>
    <script type="module" src="buffer.js"></script>
  </body>
</html>
