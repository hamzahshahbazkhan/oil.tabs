<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab-oil</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --bg: #080a12;
        --panel: #111522;
        --panel-raised: #171c2b;
        --border: #252c40;
        --muted: #77809a;
        --text: #d8def8;
        --accent: #9bb7f5;
        --pink: #e7afd5;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      }
      #appShell {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        min-height: 280px;
        overflow: hidden;
        background: var(--panel);
      }
      #topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        user-select: none;
      }
      #brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .02em;
      }
      #mode {
        margin-left: auto;
        padding: 4px 8px;
        color: var(--accent);
        background: transparent;
        border: 1px solid var(--border);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .12em;
      }
      #topHint { color: var(--muted); font-size: 11px; }
      #promptbar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 18px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      #promptGlyph { color: var(--pink); font-size: 17px; }
      #promptText { color: #9aa6cf; }
      #editor {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      #editor .cm-editor { height: 100%; }
      #staleBanner {
        flex: 0 0 auto;
        display: none;
        min-height: 30px;
        padding: 7px 16px;
        color: #f5d08a;
        background: #27251e;
        border-bottom: 1px solid #66562f;
        font-size: 11px;
      }
      #footer {
        display: flex;
        align-items: center;
        min-height: 34px;
        border-top: 1px solid var(--border);
      }
      #statusbar {
        flex: 1;
        padding: 0 16px;
        font-size: 12px;
        color: var(--muted);
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #footerHints { padding: 0 16px; color: #4e5778; font-size: 10px; }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 54px;
        z-index: 200;
        max-width: min(620px, calc(100vw - 32px));
        padding: 10px 14px;
        color: #f7d6e9;
        background: #241e2b;
        border: 1px solid #684e67;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition: opacity .18s ease, transform .18s ease;
      }
      #toast.visible { opacity: 1; transform: translate(-50%, 0); }
      #searchOverlay {
        position: fixed;
        inset: 0;
        z-index: 150;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: min(18vh, 150px);
        background: rgba(4, 6, 12, .82);
      }
      #searchOverlay.open { display: flex; }
      #searchCard {
        width: min(720px, calc(100vw - 32px));
        overflow: hidden;
        background: #111526;
        border: 1px solid var(--border);
      }
      #searchInputRow { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(126,145,196,.16); }
      #searchInputGlyph { color: #f5bde6; font-size: 18px; }
      #searchInput { flex: 1; min-width: 0; color: #d8def8; background: transparent; border: 0; outline: 0; font: 14px inherit; }
      #searchInput::placeholder { color: #697398; }
      #searchResults { max-height: min(440px, 52vh); overflow: auto; padding: 6px; }
      .searchResult { display: flex; gap: 10px; padding: 9px 10px; color: #9aa6cf; font-size: 12px; }
      .searchResult.selected { color: #d8def8; background: #26324f; }
      .searchResultIndex { width: 18px; color: #697398; text-align: right; }
      .searchResultText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #searchHint { padding: 9px 16px; color: #697398; border-top: 1px solid rgba(126,145,196,.12); font-size: 10px; }
      #closeBtn {
        position: fixed;
        top: 12px;
        right: 14px;
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        z-index: 100;
      }
      #closeBtn:hover {
        background: #26324f;
        color: var(--text);
      }
      @media (max-width: 700px) {
        #appShell { width: 100vw; height: 100vh; }
        #topHint, #footerHints { display: none; }
      }
      @media (max-height: 520px) {
        #appShell { height: 100vh; }
        #topbar { min-height: 40px; }
        #promptbar { min-height: 34px; }
      }
    </style>
  </head>
  <body>
    <main id="appShell">
      <header id="topbar">
        <div id="brand">tab-oil</div>
        <span id="topHint">tab workspace</span>
        <span id="mode">NORMAL</span>
      </header>
      <div id="promptbar"><span id="promptGlyph">❯</span><span id="promptText">tabs · arrange, focus, and edit</span></div>
      <div id="staleBanner">⚠ browser state changed — press <strong>gr</strong> to refresh</div>
      <div id="editor"></div>
      <footer id="footer"><div id="statusbar">Loading workspace…</div><div id="footerHints">Enter focus · :w save · gr refresh · ? help</div></footer>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="searchOverlay" aria-label="Search tabs">
      <div id="searchCard">
        <div id="searchInputRow"><span id="searchInputGlyph">❯</span><input id="searchInput" autocomplete="off" placeholder="Search tabs by title or URL…" /></div>
        <div id="searchResults"></div>
        <div id="searchHint">↑↓ or Ctrl-n/p navigate · Enter jump · Esc close</div>
      </div>
    </div>
    <button id="closeBtn" aria-label="Close buffer">&times;</button>
    <script type="module" src="buffer.js"></script>
  </body>
</html>
